# frontend コンテナ内の静的配信設定。外部公開はせず、前段の nginx からのみ叩かれる。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ハッシュ付きのビルド成果物は長期キャッシュしてよい。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html はキャッシュさせない (デプロイ後すぐ新しい JS を読ませるため)。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA なので未知のパスは index.html に流す。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
