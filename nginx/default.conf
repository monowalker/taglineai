# 公開エッジ。SPA は frontend コンテナ、API は backend コンテナへ振り分ける。
#
# upstream ブロックを使わず、Docker 組み込み DNS (127.0.0.11) で
# **リクエストごとに名前解決**している点が重要。
# upstream / 素の proxy_pass は起動時に一度だけ解決するため、
# `docker compose up -d --build backend` などでコンテナを作り直すと
# IP が変わり、nginx を再起動するまで 502 が出続ける。
# proxy_pass に変数を使うと実行時解決になり、この問題が起きない。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # ローカル LLM の応答は数十秒〜数分かかることがあるため、
    # プロキシのタイムアウトは十分に長く取る。
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    send_timeout          600s;

    client_max_body_size 1m;

    # 抽出結果はストリーミングせず一括で返るので、バッファリングは無効化して
    # 長時間の接続で中間バッファが溢れないようにする。
    proxy_buffering off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- エッジ自身のヘルスチェック ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API ---
    # backend 側も /api プレフィックス付きでルーティングしているため、
    # $request_uri をそのまま渡してパスは書き換えない。
    location /api/ {
        set $backend_target "backend:8000";
        proxy_pass http://$backend_target$request_uri;
    }

    # --- SPA ---
    location / {
        set $frontend_target "frontend:80";
        proxy_pass http://$frontend_target$request_uri;
    }
}
